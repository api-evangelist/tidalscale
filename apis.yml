name: TidalScale
description: 'TidalScale built software-defined server technology that aggregated the CPU, memory,
  and I/O of multiple commodity servers into a single large virtual machine (an inverse hypervisor /
  software-defined memory approach), enabling in-memory computing for very large workloads without
  specialized hardware. The company was acquired by Hewlett Packard Enterprise (HPE) in early 2022,
  and the tidalscale.com domain now redirects into HPE infrastructure (its TLS endpoint serves an
  HPE certificate). This profile was surfaced as a portfolio company of Bain Capital Ventures and
  enriched via the API Evangelist pipeline; TidalScale exposes no independent public developer API
  surface today.'
